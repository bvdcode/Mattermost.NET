name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select integration tests
        id: test-settings
        shell: bash
        run: |
          if [[ ! -f Sources/Mattermost.Tests/secrets.json ]]; then
            settings="$RUNNER_TEMP/mattermost.runsettings"
            cat > "$settings" <<'XML'
          <RunSettings>
            <RunConfiguration>
              <TestCaseFilter>FullyQualifiedName!~Mattermost.Tests.MattermostClientTests</TestCaseFilter>
            </RunConfiguration>
            <NUnit>
              <AssemblySelectLimit>2147483647</AssemblySelectLimit>
            </NUnit>
          </RunSettings>
          XML
            echo "path=$settings" >> "$GITHUB_OUTPUT"
          fi
      - name: Check solution
        uses: bvdcode/github-workflows/actions/dotnet-checks@v1
        with:
          project: Sources/Mattermost.sln
          dotnet-version: 10.0.x
          test-settings: ${{ steps.test-settings.outputs.path }}

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    uses: bvdcode/github-workflows/.github/workflows/gitversion.yml@v1

  pack:
    needs: version
    uses: bvdcode/github-workflows/.github/workflows/dotnet-pack.yml@v1
    with:
      projects: Sources/Mattermost/Mattermost.csproj
      dotnet-version: 10.0.x
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish NuGet packages
        uses: bvdcode/github-workflows/actions/nuget-publish@v1
        with:
          artifact-name: ${{ needs.pack.outputs.artifact-name }}
          version: ${{ needs.version.outputs.version }}
          authentication: api-key
          nuget-api-key: ${{ secrets.NUGET_KEY }}
          github-packages-token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
          publish: true

  release:
    needs: [version, pack, publish]
    permissions:
      contents: write
    uses: bvdcode/github-workflows/.github/workflows/release.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-name: ${{ needs.pack.outputs.artifact-name }}
